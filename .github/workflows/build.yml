name: build

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  fabric:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: chmod +x ./gradlew
      - run: ./gradlew :fabric:remapJar --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: winton-fabric-${{ github.sha }}
          path: |
            fabric/build/libs/winton-fabric-*.jar
            !fabric/build/libs/*-dev.jar
            !fabric/build/libs/*-dev-shadow.jar
          if-no-files-found: error
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            fabric/build/libs/winton-fabric-*.jar
            !fabric/build/libs/*-dev.jar
            !fabric/build/libs/*-dev-shadow.jar
          body: |
            WinTone ${{ github.ref_name }} for Minecraft Fabric 1.21.11.
            The combined program is LGPL-3.0-only.
            META-INF contains the WinTone, MiniHUD, and Tweakeroo license and notice files.
